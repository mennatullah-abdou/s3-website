name: Deploy html to s3
on: push
jobs:
  deploy:
   runs-on: ubuntu-latest
   steps:
      - name: checkout code from repo
        uses: actions/checkout@v6.1.0
      - name: configure aws credentials  
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-access-key-id: ${{ secrets.EC2_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.EC2_SECRET_KEY }}
          aws-region: us-east-1

      - name: Code static code to S3
        run: |
          aws s3 sync ./ s3://dd-mt/ \
            --exclude "*" \
            --include "index.html" 
            
      
