
name: Deploy HTML Website to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code from repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.EC2_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.EC2_SECRET_KEY }}
          aws-region: us-east-1

      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      - name: Configure S3 static website hosting
        run: |
          aws s3 website s3://dd-mt/ \
            --index-document index.html

      - name: Verify website file exists
        run: test -f index.html

      - name: Deploy HTML to S3
        run: |
          aws s3 cp index.html s3://dd-mt/index.html \
            --content-type "text/html"

      - name: Deployment completed
        run: echo "Website deployed to S3 successfully"
